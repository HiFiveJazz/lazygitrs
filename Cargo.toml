[package]
name = "lazygitrs"
version = "0.0.39"
edition = "2024"
description = "A faster, memory-safe, more ergonomic slopfork of lazygit"
repository = "https://github.com/blankeos/lazygitrs"
homepage = "https://github.com/blankeos/lazygitrs"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
gix = { version = "0.90.0", default-features = false, features = ["anyhow", "revision", "sha1", "sha256"] }
clap = { version = "4.6.7", features = ["derive"] }
# `use-dev-tty` switches crossterm off mio/kqueue onto filedescriptor's
# select()-based reader. Required on macOS under Helix `:insert-output`,
# where stdin is /dev/null so events come from /dev/tty (mio returns POLLNVAL).
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
dirs = "7.0.0"
ratatui = {
    version = "0.30.2",
    default-features = false,
    features = ["crossterm", "layout-cache"]
}
ratatui-image = { version = "=11.1.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = { package = "yaml_serde", version = "0.10" }
serde_json = "1.0.154"
once_cell = "1.21.4"
include_dir = "0.7.4"
similar = { version = "3.2.1", features = ["unicode"] }
tree-sitter = "0.27.1"
tree-sitter-highlight = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-bash = "0.25.1"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-md = "0.5.4"
unicode-width = "0.2.3"
tui-textarea = {
    package = "tui-textarea-2",
    version = "0.13.2",
    default-features = false,
    features = ["crossterm"]
}
textwrap = { version = "0.16.4", default-features = false, features = ["unicode-width"] }
libc = "0.2.191"
strip-ansi-escapes = "0.2.1"

[profile.release]
codegen-units = 1
strip = true
opt-level = 3 # Optimize for speed
lto = true
panic = "abort"

[profile.size]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = true
