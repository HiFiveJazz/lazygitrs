[package]
name = "lazygitrs"
version = "0.0.39"
edition = "2024"
description = "A faster, memory-safe, more ergonomic slopfork of lazygit"
repository = "https://github.com/blankeos/lazygitrs"
license = "MIT"

[features]
default = ["mimalloc-allocator"]
mimalloc-allocator = ["dep:mimalloc", "dep:libmimalloc-sys2"]

[dependencies]
anyhow = "1.0.104"
gix = { version = "0.90.0", default-features = false, features = ["anyhow", "parallel", "revision", "sha1", "sha256"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ratatui = {
    version = "0.30.2",
    default-features = false,
    features = ["crossterm", "layout-cache"]
}
ratatui-image = { version = "=11.1.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
serde_json = "1.0.154"
once_cell = "1.21.4"
include_dir = "0.7.4"
similar = { version = "3.2.1", features = ["unicode"] }
tree-sitter = "0.27.1"
tree-sitter-highlight = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-bash = "0.25.1"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-md = "0.5.4"
unicode-width = "0.2.3"
tui-textarea = {
    package = "tui-textarea-2",
    version = "0.13.2",
    default-features = false,
    features = ["crossterm"]
}
textwrap = { version = "0.16.4", default-features = false, features = ["unicode-width"] }
libc = "0.2.191"
mimalloc = {
    package = "mimalloc-safe",
    version = "0.1.69",
    optional = true,
    default-features = false,
    features = ["v3", "no_thp"]
}
libmimalloc-sys2 = {
    version = "0.1.65",
    optional = true,
    default-features = false,
    features = ["v3", "no_thp", "extended"]
}
strip-ansi-escapes = "0.2.1"

# Keep crossterm's normal mio backend everywhere except macOS. `use-dev-tty`
# switches to filedescriptor's select()-based reader and is only needed there
# for Helix `:insert-output`, where stdin is /dev/null and mio/kqueue reports
# POLLNVAL for /dev/tty.
[target.'cfg(not(target_os = "macos"))'.dependencies]
crossterm = "0.29.0"

[target.'cfg(target_os = "macos")'.dependencies]
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }

[profile.release]
strip = true
lto = true
trim-paths = "object"
# codegen-units = 1 # Slower build, faster code, only for new releases!
panic = "abort"

[profile.size]
inherits = "release"
opt-level = "s" # optimize for size
# opt-level = "z" # this could also work, just depends!
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
